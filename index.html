<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>X 情报总览 — 简报 Brief</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="home">
  <button class="menu-toggle" type="button" aria-label="菜单">☰</button>
  <div class="overlay"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="logo-mark">简</div><div class="logo-text">简报 <span>Brief</span></div></div>
      <nav class="nav">
        <a href="index.html" data-nav="home"><span class="nav-icon">◈</span> X 总览</a>
        <a href="stocks.html" data-nav="stocks"><span class="nav-icon">▣</span> 美股 X 情报</a>
        <a href="sources.html" data-nav="sources"><span class="nav-icon">◎</span> 来源与评分</a>
      </nav>
      <div class="sidebar-footer">仅收录 X 原帖<br />无真实数据时保持空白</div>
    </aside>

    <main class="main wide">
      <header class="page-header">
        <h1>X 情报总览</h1>
        <p class="subtitle">原帖、时间、出处与可信度依据放在同一条证据链里。</p>
        <div class="meta">
          <span class="badge"><span class="badge-dot"></span> X only</span>
          <span id="data-state">正在读取数据</span>
          <span id="updated-at"></span>
        </div>
      </header>

      <section class="score-summary" aria-label="可信度分布">
        <div><strong id="stat-total">0</strong><span>本期原帖</span></div>
        <div><strong id="stat-high">0</strong><span>高可信</span></div>
        <div><strong id="stat-medium">0</strong><span>中等</span></div>
        <div><strong id="stat-low">0</strong><span>低可信</span></div>
      </section>

      <section class="section">
        <div class="section-header">
          <h2>最新原帖</h2>
          <span class="section-note">按发帖时间倒序</span>
        </div>
        <div class="filter-row" id="category-filters">
          <button type="button" data-filter="all" class="active">全部</button>
          <button type="button" data-filter="markets">美股</button>
          <button type="button" data-filter="ai">AI</button>
          <button type="button" data-filter="macro">宏观</button>
          <button type="button" data-filter="people">人物</button>
        </div>
        <div id="x-feed" class="x-feed" aria-live="polite"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
