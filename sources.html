<body data-page="sources">
  <button class="menu-toggle" type="button" aria-label="菜单">☰</button>
  <div class="overlay"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="logo-mark">简</div><div class="logo-text">简报 <span>Brief</span></div></div>
      <nav class="nav">
        <a href="index.html" data-nav="home"><span class="nav-icon">◈</span> X 总览</a>
        <a href="stocks.html" data-nav="stocks"><span class="nav-icon">▣</span> 美股 X 情报</a>

      </nav>
      <div class="sidebar-footer">规则版本 1.0.0<br />评分必须可解释</div>
    </aside>
    <main class="main wide">
      <header class="page-header">
        <h1>来源与可信度评分</h1>
        <p class="subtitle">先看是谁说的，再看具体主张有什么证据；两者不会混成一个黑箱分数。</p>
      </header>

      <section class="section">
        <div class="section-header"><h2>评分含义</h2></div>
        <div class="rubric-grid">
          <article><strong>作者分 40%</strong><p>来自人工维护的身份与职责等级。蓝标和粉丝量不加分。</p></article>
          <article><strong>主张分 60%</strong><p>直接程度、原帖证据、独立 X 帖印证、具体性和记录完整性。</p></article>
          <article><strong>传闻与反证扣分</strong><p>“消息人士”“未经确认”、无法访问原帖、只有截图或相反证据都会扣分。</p></article>
        </div>
        <p class="disclaimer">这是证据质量评分，不是真伪概率。自动初评不能代替人工核验；预测、观点和事实应分别阅读。</p>
      </section>

      <section class="section">
        <div class="section-header"><h2>当前来源表</h2><span class="section-note">人工维护，可审计</span></div>
        <div id="source-registry" class="source-registry"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
