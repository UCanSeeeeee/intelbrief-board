<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>财报日历 — 美股情报</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="earnings">
  <button class="menu-toggle" type="button" aria-label="菜单">☰</button>
  <div class="overlay"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="logo"><div class="logo-mark">简</div><div class="logo-text">美股情报</div></div>
      <nav class="nav" aria-label="侧边栏 Tab">
        <a href="index.html" data-nav="news"><span class="nav-icon">▣</span> 美股讯息</a>
        <a href="people.html" data-nav="people"><span class="nav-icon">◎</span> 具体人物</a>
        <a href="earnings.html" data-nav="earnings"><span class="nav-icon">▤</span> 财报日历</a>
      </nav>
      <div class="sidebar-footer">财报日期来自 Nasdaq 公开日历<br />推特仅作可选交叉核对</div>
    </aside>
    <main class="main wide">
      <header class="page-header">
        <h1>财报日历</h1>
        <p class="subtitle">整理本周重要公司财报日。主源为 Nasdaq 公开日历，按市值与观察名单筛选，不为凑数补公司。</p>
        <div class="meta">
          <span class="badge"><span class="badge-dot"></span> Nasdaq</span>
          <span id="earnings-state" aria-live="polite">正在读取财报日历…</span>
        </div>
      </header>
      <section id="earnings-summary" class="earnings-summary" aria-live="polite"></section>
      <section id="earnings-board" class="earnings-board" aria-live="polite"></section>
      <p class="disclaimer">披露时间可能调整；盘前/盘后以 Nasdaq 字段为准。市值筛选阈值见配置，不等于投资建议。</p>
    </main>
  </div>
  <script src="app.js"></script>
  <script src="earnings.js"></script>
</body>
</html>
